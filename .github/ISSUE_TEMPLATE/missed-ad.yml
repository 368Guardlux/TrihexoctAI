name: Missed ad or tracker
description: Report a missed ad or clearly identified third-party tracker.
title: "Missed filter: "
labels: [missed-filter]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
      description: Remove secrets and personal query parameters before posting.
      placeholder: https://example.com/page
    validations:
      required: true
  - type: textarea
    id: element
    attributes:
      label: What was not blocked?
      description: Describe the ad or tracker and its visible behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence (optional)
      description: Share a rule-logger excerpt with personal data removed.
