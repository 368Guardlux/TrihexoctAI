name: Validate Trihexoct changes
"on":
  pull_request:
    branches: [main]
    paths:
      - "Trihexoct.txt"
      - "Trihexoct.meta.json"
      - "VERSION"
      - "src/modules/**"
      - "config/reference_feeds.json"
      - "tools/**"
      - "tests/**"
      - "requirements-ci.txt"
      - "docs/**"
      - ".github/workflows/**"
      - "README.md"
      - "README_START_HERE.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "SECURITY_MODEL.md"
      - "reports/**"

permissions:
  contents: read

jobs:
  validate:
    name: YAML, tests, offline build, and filter policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out pull request without write credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install CI-only YAML validator
        run: python -m pip install --disable-pip-version-check --requirement requirements-ci.txt

      - name: Validate all workflow YAML and step structure
        run: python tools/validate_workflows.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Audit source modules
        run: python tools/audit_source_modules.py --output /tmp/trihexoct-source-inventory.json

      - name: Offline build in temporary output path
        run: python tools/build_filter.py --output /tmp/Trihexoct.txt --report /tmp/bootstrap-build-report.json

      - name: Validate temporary filter output
        run: python tools/validate_filter.py /tmp/Trihexoct.txt

      - name: Upload offline-build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trihexoct-pr-report-${{ github.run_number }}
          path: |
            /tmp/bootstrap-build-report.json
            /tmp/trihexoct-source-inventory.json
          if-no-files-found: warn
          retention-days: 14
