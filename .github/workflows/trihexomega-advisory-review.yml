name: TRIHEXΩ manual advisory candidate review
"on":
  workflow_dispatch:
    inputs:
      cycle_run_id:
        description: "Run ID of a successful main-branch autonomous cycle (from its run URL)"
        required: true
        type: string

# This workflow is deliberately read-only. It cannot publish or commit filters.
permissions:
  actions: read
  contents: read

concurrency:
  group: trihexomega-advisory-review
  cancel-in-progress: true

jobs:
  advisory-review:
    name: Run bounded advisory swarm
    if: github.repository == '368Guardlux/TrihexoctAI'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Validate selected autonomous cycle run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_RUN_ID: ${{ inputs.cycle_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$CYCLE_RUN_ID" =~ ^[0-9]{1,20}$ ]]; then
            echo "::error::cycle_run_id must be the numeric run ID from the autonomous cycle URL."
            exit 2
          fi
          run_metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CYCLE_RUN_ID}")"
          printf '%s' "$run_metadata" | python -c '
          import json
          import sys

          run = json.load(sys.stdin)
          workflow_path = str(run.get("path", "")).split("@", 1)[0]
          expected = {
              "run_id": sys.argv[1],
              "workflow": ".github/workflows/trihexomega-autonomous-cycle.yml",
              "branch": "main",
              "repository": sys.argv[2],
          }
          actual = {
              "run_id": str(run.get("id", "")),
              "workflow": workflow_path,
              "branch": run.get("head_branch"),
              "repository": (run.get("head_repository") or {}).get("full_name"),
          }
          if any(actual[key] != value for key, value in expected.items()):
              raise SystemExit(f"Selected run is not the expected main-branch cycle: {actual}")
          event = run.get("event")
          if event not in {"schedule", "workflow_dispatch"}:
              raise SystemExit(f"Selected cycle used an unsupported event: {event!r}")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("Selected autonomous cycle must have completed successfully.")
          ' "$CYCLE_RUN_ID" "$GITHUB_REPOSITORY"

      - name: Download screened candidates from selected cycle
        uses: actions/download-artifact@v7.0.0
        with:
          name: trihexomega-candidates-${{ inputs.cycle_run_id }}
          path: candidate-input
          github-token: ${{ github.token }}
          run-id: ${{ inputs.cycle_run_id }}

      - name: Require a non-empty candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          candidate_file="candidate-input/trihexomega-candidate-proposals-ranked.json"
          python -c '
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          bundle = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(bundle, dict) or bundle.get("schema_version") != 1:
              raise SystemExit("Selected artifact does not contain a valid candidate bundle.")
          candidates = bundle.get("candidates")
          if not isinstance(candidates, list):
              raise SystemExit("Selected artifact does not contain a valid candidate bundle.")
          if not candidates:
              raise SystemExit("Selected autonomous cycle produced no eligible candidates to review.")
          ' "$candidate_file"
          echo "TRIHEXOMEGA_CANDIDATES=$GITHUB_WORKSPACE/$candidate_file" >> "$GITHUB_ENV"

      - name: Run the bounded specialist review on manually supplied candidates
        if: github.ref == 'refs/heads/main'
        env:
          TRIHEXOMEGA_AI_API_KEY: ${{ secrets.TRIHEXOMEGA_AI_API_KEY }}
          TRIHEXOMEGA_AI_MODEL: ${{ vars.TRIHEXOMEGA_AI_MODEL }}
          TRIHEXOMEGA_AI_BASE_URL: ${{ vars.TRIHEXOMEGA_AI_BASE_URL || 'https://api.openai.com/v1' }}
          TRIHEXOMEGA_AI_ALLOWED_HOSTS: ${{ vars.TRIHEXOMEGA_AI_ALLOWED_HOSTS || 'api.openai.com' }}
        run: >-
          python tools/trihexomega/swarm.py
          --candidates "${TRIHEXOMEGA_CANDIDATES}"
          --agents config/trihexomega_agents.json
          --output reports/trihexomega-swarm-review.json
          --workers 8
          --memory reports/trihexomega-human-review-memory.jsonl

      - name: Run deterministic preflight when not on main
        if: github.ref != 'refs/heads/main'
        env:
          TRIHEXOMEGA_AI_API_KEY: ""
          TRIHEXOMEGA_AI_MODEL: ""
        run: >-
          python tools/trihexomega/swarm.py
          --candidates "${TRIHEXOMEGA_CANDIDATES}"
          --agents config/trihexomega_agents.json
          --output reports/trihexomega-swarm-review.json
          --workers 8
          --memory reports/trihexomega-human-review-memory.jsonl

      - name: Upload advisory report
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: trihexomega-advisory-review-${{ github.run_number }}
          path: reports/trihexomega-swarm-review.json
          if-no-files-found: warn
          retention-days: 30
