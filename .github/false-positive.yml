name: False positive / site breakage
description: Report a rule that hides legitimate content or breaks a site feature.
title: "False positive: "
labels: [false-positive]
body:
  - type: input
    id: url
    attributes:
      label: Affected page URL
      description: Remove any login tokens, session IDs, private query values, or other secrets first.
      placeholder: https://example.com/page
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected vs actual behavior
      placeholder: What should happen, and what actually happens?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Matching rule, if known
      description: Use Brave's adblock inspector or Shields panel to locate it.
